name: post-weekly-release
run-name: Build, test, generate signed artifacts and optionally prepare release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - '*'
  schedule:
    - cron: '17 2 * * 1'

jobs:

  build-ubuntu-arm64:
    name: Ubuntu arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Git checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Update apt packages
        run: sudo apt-get update

      - name: Install ImageMagick
        run: sudo apt-get install imagemagick

      - name: Build release
        run: |
          export CXX=clang++
          mkdir build_rel
          cd build_rel
          cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=../ -DASTCENC_ISA_NEON=ON -DASTCENC_ISA_SVE_128=ON -DASTCENC_ISA_SVE_256=ON -DASTCENC_PACKAGE=arm64 ..
          make install package -j4

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: astcenc-linux-arm64
          path: |
            build_rel/*.zip
            build_rel/*.zip.sha256

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Get Python modules
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run functional tests
        run: |
          python ./Test/astc_test_functional.py --encoder neon
          python ./Test/astc_test_functional.py --encoder sve_128

      - name: Run image tests
        run: |
          python ./Test/astc_test_image.py --encoder neon --test-set Small
          python ./Test/astc_test_image.py --encoder sve_128 --test-set Small

  build-ubuntu-x64:
    name: Ubuntu x64
    runs-on: ubuntu-24.04
    steps:
      - name: Git checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Update apt packages
        run: sudo apt-get update

      - name: Install ImageMagick
        run: sudo apt-get install imagemagick

      - name: Build release
        run: |
          export CXX=clang++
          mkdir build_rel
          cd build_rel
          cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=../ -DASTCENC_ISA_AVX512=ON -DASTCENC_ISA_AVX256=ON -DASTCENC_ISA_AVX2=ON -DASTCENC_ISA_SSE41=ON -DASTCENC_ISA_SSE2=ON -DASTCENC_PACKAGE=x64 ..
          make install package -j4

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: astcenc-linux-x86_64
          path: |
            build_rel/*.zip
            build_rel/*.zip.sha256

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Get Python modules
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # AVX256 and AVX512 binaries are always packaged, but runners may lack support
      # Both require the same ISA features, so probe the AVX512 binary before running
      - name: Run functional tests
        run: |
          python ./Test/astc_test_functional.py
          if ./bin/astcenc-avx512 -help >/dev/null 2>&1; then
            python ./Test/astc_test_functional.py --encoder avx256
            python ./Test/astc_test_functional.py --encoder avx512
          else
            echo "Skipping avx256/avx512 tests: host does not support AVX-512"
          fi

      - name: Run image tests
        run: |
          python ./Test/astc_test_image.py --encoder sse2 --test-set Small
          python ./Test/astc_test_image.py --encoder sse4.1 --test-set Small
          python ./Test/astc_test_image.py --encoder avx2 --test-set Small
          if ./bin/astcenc-avx512 -help >/dev/null 2>&1; then
            python ./Test/astc_test_image.py --encoder avx256 --test-set Small
            python ./Test/astc_test_image.py --encoder avx512 --test-set Small
          else
            echo "Skipping avx256/avx512 tests: host does not support AVX-512"
          fi

  test-ubuntu-sanitizers:
    name: Ubuntu ${{ matrix.platform }} Clang (${{ matrix.sanitizer }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ASAN, UBSAN]
        platform: [arm64, x64]
        include:
          - platform: arm64
            runner: ubuntu-24.04-arm
            isa_flags: -DASTCENC_ISA_NONE=ON -DASTCENC_ISA_NEON=ON -DASTCENC_ISA_SVE_128=ON
            encoders: none neon sve_128
          - platform: x64
            runner: ubuntu-24.04
            isa_flags: -DASTCENC_ISA_NONE=ON -DASTCENC_ISA_SSE2=ON -DASTCENC_ISA_SSE41=ON -DASTCENC_ISA_AVX2=ON -DASTCENC_ISA_AVX512=ON -DASTCENC_ISA_AVX256=ON
            encoders: none sse2 sse4.1 avx2
    env:
      CXX: clang++
    steps:
      - name: Git checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Update apt packages
        run: sudo apt-get update

      - name: Install ImageMagick
        run: sudo apt-get install imagemagick

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Get Python modules
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build sanitizer
        run: |
          cmake -S . -B build_rel -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX="$PWD" \
            -DASTCENC_UNITTEST=ON -DASTCENC_${{ matrix.sanitizer }}=ON \
            ${{ matrix.isa_flags }}
          cmake --build build_rel --target install -j4

      - name: Run unit tests
        run: |
          if [ "${{ matrix.platform }}" = x64 ] &&
             ! ../bin/astcenc-avx512 -help >/dev/null 2>&1; then
            echo "Skipping avx256/avx512 unit tests: host does not support the AVX-512 variants"
            ctest -E 'test-unit-avx(256|512)' --output-on-failure --no-tests=error
          else
            ctest --output-on-failure --no-tests=error
          fi
        working-directory: build_rel

      - name: Run functional tests
        run: |
          for ENCODER in ${{ matrix.encoders }}; do
            python ./Test/astc_test_functional.py --encoder "$ENCODER"
          done
          if [ "${{ matrix.platform }}" = x64 ] &&
             ./bin/astcenc-avx512 -help >/dev/null 2>&1; then
            python ./Test/astc_test_functional.py --encoder avx256
            python ./Test/astc_test_functional.py --encoder avx512
          fi

      - name: Run image tests
        run: |
          for ENCODER in ${{ matrix.encoders }}; do
            python ./Test/astc_test_image.py --encoder "$ENCODER" --test-set Small
          done
          if [ "${{ matrix.platform }}" = x64 ] &&
             ./bin/astcenc-avx512 -help >/dev/null 2>&1; then
            python ./Test/astc_test_image.py --encoder avx256 --test-set Small
            python ./Test/astc_test_image.py --encoder avx512 --test-set Small
          fi

  build-macos-universal:
    name: macOS universal
    runs-on: macos-26
    steps:
      - name: Git checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Build release
        run: |
          mkdir build_rel
          cd build_rel
          cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=../ -DASTCENC_PACKAGE=universal ..
          make install package -j4

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: astcenc-macos-universal
          path: |
            build_rel/*.zip
            build_rel/*.zip.sha256

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Get Python modules
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run image tests
        run: |
          python ./Test/astc_test_image.py --test-set Small --encoder universal

  build-windows-multi:
    name: Windows multi
    runs-on: windows-2022
    steps:
      - name: Git checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Setup Visual Studio x86_64
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build release x64
        run: |
          mkdir build_rel
          cd build_rel
          cmake -G "Visual Studio 17 2022" -T ClangCL -DCMAKE_INSTALL_PREFIX=../ -DASTCENC_ISA_AVX512=ON -DASTCENC_ISA_AVX256=ON -DASTCENC_ISA_AVX2=ON -DASTCENC_ISA_SSE41=ON -DASTCENC_ISA_SSE2=ON -DASTCENC_PACKAGE=x64 ..
          msbuild astcencoder.sln -property:Configuration=Release
          msbuild PACKAGE.vcxproj -property:Configuration=Release
          msbuild INSTALL.vcxproj -property:Configuration=Release
        shell: cmd

      - name: Setup Visual Studio arm64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86_arm64

      - name: Build release arm64
        run: |
          mkdir build_rel_arm64
          cd build_rel_arm64
          cmake -G "Visual Studio 17 2022" -A ARM64 -T ClangCL -DCMAKE_INSTALL_PREFIX=../ -DASTCENC_ISA_NEON=ON -DASTCENC_PACKAGE=arm64 ..
          msbuild astcencoder.sln -property:Configuration=Release
          msbuild PACKAGE.vcxproj -property:Configuration=Release
          msbuild INSTALL.vcxproj -property:Configuration=Release
        shell: cmd

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: astcenc-windows-multi-cl
          path: |
            build_rel/*.zip
            build_rel/*.zip.sha256
            build_rel_arm64/*.zip
            build_rel_arm64/*.zip.sha256

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Get Python modules
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
        shell: cmd

      - name: Run image tests
        run: |
          python ./Test/astc_test_image.py --test-set Small
          if errorlevel 1 (
            exit /b 1
          )
          bin\astcenc-avx512.exe -help >nul 2>&1
          if errorlevel 1 (
            echo Skipping avx256/avx512 tests: host does not support AVX-512
          ) else (
            python ./Test/astc_test_image.py --encoder avx256 --test-set Small
            if errorlevel 1 (
              exit /b 1
            )
            python ./Test/astc_test_image.py --encoder avx512 --test-set Small
            if errorlevel 1 (
              exit /b 1
            )
          )
          exit /b 0
        shell: cmd

  sign-binaries:
    if: ${{ (startsWith(github.event.ref, 'refs/tags/')) && (github.repository_owner == 'Arm-software') }}
    name: Sign Windows and macOS
    runs-on: [self-hosted-ubuntu-latest-x64]
    needs: [build-macos-universal, build-windows-multi]
    steps:
      - name: Checkout signing code
        env:
          SIGNING_REPO_URL: ${{ secrets.SIGNING_REPO_URL }}
        run: |
          git clone --depth 1 ${SIGNING_REPO_URL}

      - name: Install code sign v2 client
        env:
          ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
          ARTIFACTORY_APIKEY: ${{ secrets.ARTIFACTORY_APIKEY }}
          ARTIFACTORY_FQDN: ${{ secrets.ARTIFACTORY_FQDN }}
        run: |
          python3.11 -m venv cs
          . ./cs/bin/activate
          pip install -i https://${ARTIFACTORY_USER}:${ARTIFACTORY_APIKEY}@${ARTIFACTORY_FQDN}/artifactory/api/pypi/dsgcore.pypi/simple code-signer-client

      - name: Download macOS binaries
        uses: actions/download-artifact@v8
        with:
          name: astcenc-macos-universal
          path: mac

      - name: Download Windows binaries
        uses: actions/download-artifact@v8
        with:
          name: astcenc-windows-multi-cl
          path: windows

      - name: Sign macOS binaries
        env:
          CODESIGNER_USER: ${{ secrets.CODESIGNER_USER }}
        run: |
          . ./cs/bin/activate
          cd mac
          python3 ${GITHUB_WORKSPACE}/signing/macos-client-wrapper.py ${CODESIGNER_USER} *.zip

      - name: Sign Windows binaries
        env:
          ARTIFACTORY_APIKEY: ${{ secrets.ARTIFACTORY_APIKEY }}
        run: |
          . ./cs/bin/activate
          cd windows
          for FILENAME in */*; do mv ${FILENAME} .; done
          for ZIPFILE in *.zip; do python3 ../signing/windows-client-wrapper.py -b ${GITHUB_RUN_NUMBER} -t ${ARTIFACTORY_APIKEY} ${ZIPFILE}; done

      - name: Upload signed binaries
        uses: actions/upload-artifact@v7
        with:
          name: signed-binaries
          path: |
            windows/*
            mac/*

      - name: Tidy intermediate artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            astcenc-windows-multi-cl
            astcenc-macos-universal

  prepare-release:
    if: ${{ (startsWith(github.event.ref, 'refs/tags/')) && (github.repository_owner == 'Arm-software') }}
    name: Prepare release
    runs-on: ubuntu-24.04
    needs: [sign-binaries, build-ubuntu-x64]
    steps:
      - name: Git checkout
        uses: actions/checkout@v6

      - name: Download signed binaries
        uses: actions/download-artifact@v8
        with:
          name: signed-binaries
          path: prepare-release

      - name: Download Linux x86_64 binaries
        uses: actions/download-artifact@v8
        with:
          name: astcenc-linux-x86_64
          path: prepare-release

      - name: Download Linux arm64 binaries
        uses: actions/download-artifact@v8
        with:
          name: astcenc-linux-arm64
          path: prepare-release

      - name: Flatten file structure
        run: |
          cd prepare-release
          for FILENAME in */*; do mv ${FILENAME} .; done
          rmdir windows
          rmdir mac

      - name: Create checksum file
        run: |
          cd prepare-release
          cat *.sha256 > release-sha256.txt
          rm *.sha256

      - name: Create release body
        run: |
          export STATUS_DATE=$(date "+%B %Y")
          GITHUB_REF=${{ github.ref }} ; export RELEASE_VERSION=${GITHUB_REF##*/}
          export SHA_CHECKSUMS=$(cat prepare-release/release-sha256.txt)
          envsubst < .github/workflows/release_body_template.md > prepare-release/release_body.md

      - name: Create release
        id: create_release
        uses: comnoco/create-release-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ github.ref }}
          body_path: prepare-release/release_body.md
          draft: true

      - name: Attach artifacts
        uses: AButler/upload-release-assets@v3.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          release-id: ${{ steps.create_release.outputs.id }}
          files: "prepare-release/astcenc-*-*-*.zip;prepare-release/release-sha256.txt"
