name: Build and test
run-name: Build and test PR${{ github.event.number }}

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'

jobs:
  build-ubuntu-arm64-clang:
    name: Ubuntu arm64 Clang
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Git checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Update apt packages
        run: sudo apt-get update

      - name: Install ImageMagick
        run: sudo apt-get install imagemagick

      - name: Build release
        run: |
          export CXX=clang++
          mkdir build_rel
          cd build_rel
          cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=../ -DASTCENC_UNITTEST=ON -DASTCENC_ISA_NEON=ON -DASTCENC_ISA_SVE_128=ON -DASTCENC_ISA_SVE_256=ON -DASTCENC_ISA_NONE=ON -DASTCENC_PACKAGE=arm64 ..
          make install package -j4

      - name: Build debug
        run: |
          export CXX=clang++
          mkdir build_dbg
          cd build_dbg
          cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DASTCENC_ISA_NEON=ON -DASTCENC_ISA_SVE_128=ON -DASTCENC_ISA_SVE_256=ON -DASTCENC_ISA_NONE=ON ..
          make -j4

      - name: Build example
        run: |
          export CXX=clang++
          mkdir build_rel
          cd build_rel
          cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DASTCENC_VERSION=refs/pull/${{ github.event.number }}/head ..
          make -j4
        working-directory: Utils/Example

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: astcenc-linux-arm64
          path: |
            build_rel/*.zip
            build_rel/*.zip.sha256

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Get Python modules
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        # The runner only supports 128-bit SVE
        run: ctest -E test-unit-sve_256 --rerun-failed --output-on-failure
        working-directory: build_rel

      - name: Run functional tests
        run: |
          python ./Test/astc_test_functional.py --encoder none
          python ./Test/astc_test_functional.py --encoder neon
          python ./Test/astc_test_functional.py --encoder sve_128

      - name: Run image tests
        run: |
          python ./Test/astc_test_image.py --encoder none --test-set Small
          python ./Test/astc_test_image.py --encoder neon --test-set Small
          python ./Test/astc_test_image.py --encoder sve_128 --test-set Small

  build-ubuntu-arm64-gcc:
    name: Ubuntu arm64 GCC
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Git checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Update apt packages
        run: sudo apt-get update

      - name: Install ImageMagick
        run: sudo apt-get install imagemagick

      - name: Install GCC 14
        run: sudo apt-get install -y gcc-14

      - name: Build release
        run: |
          export CXX=g++-14
          mkdir build_rel
          cd build_rel
          cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=../ -DASTCENC_UNITTEST=ON -DASTCENC_ISA_NEON=ON -DASTCENC_ISA_SVE_128=ON -DASTCENC_ISA_NONE=ON ..
          make install -j4

      - name: Build debug
        run: |
          export CXX=g++-14
          mkdir build_dbg
          cd build_dbg
          cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DASTCENC_ISA_NEON=ON DASTCENC_ISA_SVE_128=ON -DASTCENC_ISA_NONE=ON ..
          make -j4

      - name: Build example
        run: |
          export CXX=g++-14
          mkdir build_rel
          cd build_rel
          cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DASTCENC_VERSION=refs/pull/${{ github.event.number }}/head ..
          make -j4
        working-directory: Utils/Example

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Get Python modules
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        # The runner only supports 128-bit SVE
        run: ctest -E test-unit-sve_256 --rerun-failed --output-on-failure
        working-directory: build_rel

      - name: Run functional tests
        run: |
          python ./Test/astc_test_functional.py --encoder none
          python ./Test/astc_test_functional.py --encoder neon
          python ./Test/astc_test_functional.py --encoder sve_128

      - name: Run image tests
        run: |
          python ./Test/astc_test_image.py --encoder none --test-set Small
          python ./Test/astc_test_image.py --encoder neon --test-set Small
          python ./Test/astc_test_image.py --encoder sve_128 --test-set Small

  build-ubuntu-x64-clang:
    name: Ubuntu x64 Clang
    runs-on: ubuntu-24.04
    steps:
      - name: Git checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Update apt packages
        run: sudo apt-get update

      - name: Install ImageMagick
        run: sudo apt-get install imagemagick

      - name: Build release
        run: |
          export CXX=clang++
          mkdir build_rel
          cd build_rel
          cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=../ -DASTCENC_UNITTEST=ON -DASTCENC_ISA_AVX512=ON -DASTCENC_ISA_AVX256=ON -DASTCENC_ISA_AVX2=ON -DASTCENC_ISA_SSE41=ON -DASTCENC_ISA_SSE2=ON -DASTCENC_ISA_NONE=ON -DASTCENC_UNITTEST=ON -DASTCENC_PACKAGE=x64 ..
          make install package -j4

      - name: Build debug
        run: |
          export CXX=clang++
          mkdir build_dbg
          cd build_dbg
          cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Debug -DASTCENC_ISA_AVX512=ON -DASTCENC_ISA_AVX256=ON -DASTCENC_ISA_AVX2=ON -DASTCENC_ISA_SSE41=ON -DASTCENC_ISA_SSE2=ON -DASTCENC_ISA_NONE=ON ..
          make -j4

      - name: Build example
        run: |
          export CXX=clang++
          mkdir build_rel
          cd build_rel
          cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DASTCENC_VERSION=refs/pull/${{ github.event.number }}/head ..
          make -j4
        working-directory: Utils/Example

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: astcenc-linux-x64
          path: |
            build_rel/*.zip
            build_rel/*.zip.sha256

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Get Python modules
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: |
          if ../bin/astcenc-avx512 -help >/dev/null 2>&1; then
            ctest --rerun-failed --output-on-failure
          else
            echo "Skipping avx256/avx512 unit tests: host does not support the AVX-512 variants"
            ctest -E 'test-unit-avx(256|512)' --rerun-failed --output-on-failure
          fi
        working-directory: build_rel

      - name: Run functional tests
        run: |
          python ./Test/astc_test_functional.py --encoder none
          python ./Test/astc_test_functional.py --encoder sse2
          python ./Test/astc_test_functional.py --encoder sse4.1
          python ./Test/astc_test_functional.py --encoder avx2
          if ./bin/astcenc-avx512 -help >/dev/null 2>&1; then
            python ./Test/astc_test_functional.py --encoder avx256
            python ./Test/astc_test_functional.py --encoder avx512
          else
            echo "Skipping avx256/avx512 execute tests: host does not support the AVX-512 variants"
          fi

      - name: Run image tests
        run: |
          python ./Test/astc_test_image.py --encoder none --test-set Small
          python ./Test/astc_test_image.py --encoder all-x86 --test-set Small
          if ./bin/astcenc-avx512 -help >/dev/null 2>&1; then
            python ./Test/astc_test_image.py --encoder avx256 --test-set Small
            python ./Test/astc_test_image.py --encoder avx512 --test-set Small
          else
            echo "Skipping avx256/avx512 execute tests: host does not support the AVX-512 variants"
          fi

  build-ubuntu-x64-gcc:
    name: Ubuntu x64 GCC
    runs-on: ubuntu-24.04
    steps:
      - name: Git checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Update apt packages
        run: sudo apt-get update

      - name: Install ImageMagick
        run: sudo apt-get install imagemagick

      - name: Build release
        run: |
          export CXX=g++
          mkdir build_rel
          cd build_rel
          cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=../ -DASTCENC_UNITTEST=ON -DASTCENC_ISA_AVX512=ON -DASTCENC_ISA_AVX256=ON -DASTCENC_ISA_AVX2=ON -DASTCENC_ISA_SSE41=ON -DASTCENC_ISA_SSE2=ON -DASTCENC_ISA_NONE=ON -DASTCENC_UNITTEST=ON -DASTCENC_PACKAGE=x64 ..
          make install package -j4

      - name: Build debug
        run: |
          export CXX=g++
          mkdir build_dbg
          cd build_dbg
          cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Debug -DASTCENC_ISA_AVX512=ON -DASTCENC_ISA_AVX256=ON -DASTCENC_ISA_AVX2=ON -DASTCENC_ISA_SSE41=ON -DASTCENC_ISA_SSE2=ON -DASTCENC_ISA_NONE=ON ..
          make -j4

      - name: Build example
        run: |
          export CXX=g++
          mkdir build_rel
          cd build_rel
          cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DASTCENC_VERSION=refs/pull/${{ github.event.number }}/head ..
          make -j4
        working-directory: Utils/Example

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Get Python modules
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: |
          if ../bin/astcenc-avx512 -help >/dev/null 2>&1; then
            ctest --rerun-failed --output-on-failure
          else
            echo "Skipping avx256/avx512 unit tests: host does not support the AVX-512 variants"
            ctest -E 'test-unit-avx(256|512)' --rerun-failed --output-on-failure
          fi
        working-directory: build_rel

      - name: Run functional tests
        run: |
          python ./Test/astc_test_functional.py --encoder none
          python ./Test/astc_test_functional.py --encoder sse2
          python ./Test/astc_test_functional.py --encoder sse4.1
          python ./Test/astc_test_functional.py --encoder avx2
          if ./bin/astcenc-avx512 -help >/dev/null 2>&1; then
            python ./Test/astc_test_functional.py --encoder avx256
            python ./Test/astc_test_functional.py --encoder avx512
          else
            echo "Skipping avx256/avx512 execute tests: host does not support the AVX-512 variants"
          fi

      - name: Run image tests
        run: |
          python ./Test/astc_test_image.py --encoder none --test-set Small
          python ./Test/astc_test_image.py --encoder all-x86 --test-set Small
          if ./bin/astcenc-avx512 -help >/dev/null 2>&1; then
            python ./Test/astc_test_image.py --encoder avx256 --test-set Small
            python ./Test/astc_test_image.py --encoder avx512 --test-set Small
          else
            echo "Skipping avx256/avx512 execute tests: host does not support the AVX-512 variants"
          fi

  build-ubuntu-sanitizers:
    name: Ubuntu ${{ matrix.platform }} ${{ matrix.compiler }} (${{ matrix.sanitizer }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ASAN, UBSAN]
        platform: [arm64, x64]
        compiler: [Clang, GCC]
        include:
          - platform: arm64
            runner: ubuntu-24.04-arm
            isa_flags: -DASTCENC_ISA_NEON=ON -DASTCENC_ISA_SVE_128=ON -DASTCENC_ISA_NONE=ON
            # The runner only supports 128-bit SVE
            ctest_flags: -E test-unit-sve_256
            functional_encoders: none neon sve_128
            image_encoders: none neon sve_128
          - platform: x64
            runner: ubuntu-24.04
            isa_flags: -DASTCENC_ISA_AVX512=ON -DASTCENC_ISA_AVX256=ON -DASTCENC_ISA_AVX2=ON -DASTCENC_ISA_SSE41=ON -DASTCENC_ISA_SSE2=ON -DASTCENC_ISA_NONE=ON
            extra_flags: -DASTCENC_PACKAGE=x64
            functional_encoders: none sse2 sse4.1 avx2 avx256 avx512
            image_encoders: none all-x86 avx256 avx512
          - compiler: Clang
            cxx: clang++
            build_targets: install package
          - compiler: GCC
            cxx: g++
            build_targets: install package
          - platform: arm64
            compiler: Clang
            extra_flags: -DASTCENC_ISA_SVE_256=ON -DASTCENC_PACKAGE=arm64
          - platform: arm64
            compiler: GCC
            cxx: g++-14
            build_targets: install
          # GCC ASAN retains its existing reduced test selections
          - platform: arm64
            compiler: GCC
            sanitizer: ASAN
            ctest_flags: ''
            functional_encoders: none sve_128
            image_encoders: neon sve_128
          - platform: x64
            compiler: GCC
            sanitizer: ASAN
            functional_encoders: none
            image_encoders: avx2 avx256 avx512
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Update apt packages
        run: sudo apt-get update

      - name: Install ImageMagick
        run: sudo apt-get install imagemagick

      - name: Install GCC 14
        if: matrix.platform == 'arm64' && matrix.compiler == 'GCC'
        run: sudo apt-get install -y gcc-14

      - name: Build release
        run: |
          cmake -S . -B build_rel -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX="$PWD" \
            -DASTCENC_UNITTEST=ON -DASTCENC_${{ matrix.sanitizer }}=ON \
            ${{ matrix.isa_flags }} ${{ matrix.extra_flags }}
          cmake --build build_rel --target ${{ matrix.build_targets }} -j4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Get Python modules
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: |
          if [ "${{ matrix.platform }}" = x64 ] &&
             ! ../bin/astcenc-avx512 -help >/dev/null 2>&1; then
            echo "Skipping avx256/avx512 unit tests: host does not support the AVX-512 variants"
            ctest -E 'test-unit-avx(256|512)' --rerun-failed --output-on-failure
          else
            ctest ${{ matrix.ctest_flags }} --rerun-failed --output-on-failure
          fi
        working-directory: build_rel

      - name: Run functional tests
        run: |
          for ENCODER in ${{ matrix.functional_encoders }}; do
            if { [ "$ENCODER" = avx256 ] || [ "$ENCODER" = avx512 ]; } &&
               ! ./bin/astcenc-"$ENCODER" -help >/dev/null 2>&1; then
              echo "Skipping $ENCODER execute tests: host does not support the AVX-512 variants"
              continue
            fi
            python ./Test/astc_test_functional.py --encoder "$ENCODER"
          done

      - name: Run image tests
        run: |
          for ENCODER in ${{ matrix.image_encoders }}; do
            if { [ "$ENCODER" = avx256 ] || [ "$ENCODER" = avx512 ]; } &&
               ! ./bin/astcenc-"$ENCODER" -help >/dev/null 2>&1; then
              echo "Skipping $ENCODER execute tests: host does not support the AVX-512 variants"
              continue
            fi
            python ./Test/astc_test_image.py --encoder "$ENCODER" --test-set Small --pairwise
          done

  test-ubuntu-clang-monkey:
    name: Ubuntu x64 Clang monkey (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        sanitizer: [ASAN, TSAN, UBSAN]
    env:
      CXX: clang++
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - name: Git checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Update apt packages
        run: sudo apt-get update

      - name: Install LLD
        run: sudo apt-get install -y lld

      - name: Build monkey test
        run: |
          cmake -S . -B build_monkey -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DASTCENC_ISA_AVX2=ON \
            -DASTCENC_CLI=OFF -DASTCENC_UNITTEST=ON \
            -DASTCENC_${{ matrix.sanitizer }}=ON
          cmake --build build_monkey --target test-monkey-avx2 -j4

      - name: Run monkey test for three minutes
        run: |
          ./build_monkey/Source/test-monkey-avx2 \
            --duration 180 --workers 4 --max-threads 4 --seed 1

  build-macos-x64-clang:
    name: macOS x64 Clang
    runs-on: macos-26
    steps:
      - name: Git checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Build release
        run: |
          mkdir build_rel
          cd build_rel
          cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=../ -DASTCENC_UNITTEST=ON -DASTCENC_UNIVERSAL_BUILD=OFF -DASTCENC_ISA_AVX2=ON -DASTCENC_ISA_SSE41=ON -DASTCENC_ISA_SSE2=ON -DASTCENC_PACKAGE=x64 ..
          make install package -j4

      - name: Build debug
        run: |
          mkdir build_dbg
          cd build_dbg
          cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Debug -DASTCENC_UNIVERSAL_BUILD=OFF -DASTCENC_ISA_AVX2=ON -DASTCENC_ISA_SSE41=ON -DASTCENC_ISA_SSE2=ON -DASTCENC_ISA_NONE=ON ..
          make -j4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Get Python modules
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: ctest -E test-unit-avx2 --rerun-failed --output-on-failure
        working-directory: build_rel

      - name: Run image tests
        run: |
          python ./Test/astc_test_image.py  --encoder sse4.1 --test-set Small

  build-macos-universal-clang:
    name: macOS universal Clang
    runs-on: macos-26
    steps:
      - name: Git checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Build release
        run: |
          mkdir build_rel
          cd build_rel
          cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=../ -DASTCENC_UNITTEST=ON -DASTCENC_UNIVERSAL_BUILD=ON -DASTCENC_PACKAGE=x64 ..
          make install package -j4

      - name: Build debug
        run: |
          mkdir build_dbg
          cd build_dbg
          cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Debug -DASTCENC_UNIVERSAL_BUILD=ON ..
          make -j4

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: astcenc-macos-universal
          path: |
            build_rel/*.zip
            build_rel/*.zip.sha256

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Get Python modules
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: ctest -E test-unit-avx2 --rerun-failed --output-on-failure
        working-directory: build_rel

      - name: Run image tests
        run: |
          python ./Test/astc_test_image.py --encoder universal --test-set Small

  build-windows-x64-msvc:
    name: Windows x64 MSVC
    runs-on: windows-2022
    steps:
      - name: Git checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Setup Visual Studio x86_64
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build release
        run: |
          mkdir build_rel
          cd build_rel
          cmake -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=../ -DASTCENC_UNITTEST=ON -DASTCENC_ISA_AVX2=ON -DASTCENC_ISA_SSE41=ON -DASTCENC_ISA_SSE2=ON -DASTCENC_PACKAGE=x64 ..
          nmake install package
        shell: cmd

      - name: Build debug
        run: |
          mkdir build_dbg
          cd build_dbg
          cmake -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Debug -DASTCENC_ISA_AVX2=ON -DASTCENC_ISA_SSE41=ON -DASTCENC_ISA_SSE2=ON -DASTCENC_ISA_NONE=ON ..
          nmake
        shell: cmd

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Get Python modules
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
        shell: cmd

      - name: Run unit tests
        run: ctest -C Release --rerun-failed --output-on-failure
        working-directory: build_rel

      - name: Run image tests
        run: |
          python ./Test/astc_test_image.py --test-set Small
        shell: cmd

  build-windows-x64-clangcl:
    name: Windows x64 ClangCL
    runs-on: windows-2022
    steps:
      - name: Git checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Setup Visual Studio x86_64
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build release
        run: |
          mkdir build_rel
          cd build_rel
          cmake -G "Visual Studio 17 2022" -T ClangCL -DCMAKE_INSTALL_PREFIX=../ -DASTCENC_UNITTEST=ON -DASTCENC_ISA_AVX512=ON -DASTCENC_ISA_AVX256=ON -DASTCENC_ISA_AVX2=ON -DASTCENC_ISA_SSE41=ON -DASTCENC_ISA_SSE2=ON -DASTCENC_PACKAGE=x64 ..
          msbuild astcencoder.sln -property:Configuration=Release
          msbuild PACKAGE.vcxproj -property:Configuration=Release
          msbuild INSTALL.vcxproj -property:Configuration=Release
        shell: cmd

      - name: Build debug
        run: |
          mkdir build_dbg
          cd build_dbg
          cmake -G "Visual Studio 17 2022" -T ClangCL -DASTCENC_UNITTEST=ON -DASTCENC_ISA_AVX512=ON -DASTCENC_ISA_AVX256=ON -DASTCENC_ISA_AVX2=ON -DASTCENC_ISA_SSE41=ON -DASTCENC_ISA_SSE2=ON ..
          msbuild astcencoder.sln -property:Configuration=Debug
        shell: cmd

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: astcenc-windows-x64
          path: |
            build_rel/*.zip
            build_rel_arm64/*.zip

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Get Python modules
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
        shell: cmd

      - name: Run unit tests
        run: |
          ..\bin\astcenc-avx512.exe -help >nul 2>&1
          if errorlevel 1 (
            echo Skipping avx256/avx512 unit tests: host does not support the AVX-512 variants
            ctest -C Release -E "test-unit-avx(256|512)" --rerun-failed --output-on-failure
          ) else (
            ctest -C Release --rerun-failed --output-on-failure
          )
          exit /b %errorlevel%
        shell: cmd
        working-directory: build_rel

      - name: Run image tests
        run: |
          python ./Test/astc_test_image.py --test-set Small
          if errorlevel 1 (
            exit /b 1
          )
          bin\astcenc-avx512.exe -help >nul 2>&1
          if errorlevel 1 (
            echo Skipping avx256/avx512 execute tests: host does not support the AVX-512 variants
          ) else (
            python ./Test/astc_test_image.py --encoder avx256 --test-set Small
            if errorlevel 1 (
              exit /b 1
            )
            python ./Test/astc_test_image.py --encoder avx512 --test-set Small
            if errorlevel 1 (
              exit /b 1
            )
          )
          exit /b 0
        shell: cmd

  build-windows-arm64-clangcl:
    name: Windows arm64 ClangCL
    runs-on: windows-2022
    steps:
      - name: Git checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Setup Visual Studio arm64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86_arm64

      - name: Build release
        run: |
          mkdir build_rel
          cd build_rel
          cmake -G "Visual Studio 17 2022" -A ARM64 -T ClangCL -DASTCENC_ISA_NEON=ON -DASTCENC_PACKAGE=arm64-clangcl ..
          msbuild astcencoder.sln -property:Configuration=Release
          msbuild PACKAGE.vcxproj -property:Configuration=Release
          msbuild INSTALL.vcxproj -property:Configuration=Release
        shell: cmd

      - name: Build debug
        run: |
          mkdir build_dbg
          cd build_dbg
          cmake -G "Visual Studio 17 2022" -A ARM64 -T ClangCL -DASTCENC_ISA_NEON=ON ..
          msbuild astcencoder.sln -property:Configuration=Debug
        shell: cmd

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: astcenc-windows-arm64
          path: |
            build_rel/*.zip
